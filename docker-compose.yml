services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: loupgarou
      POSTGRES_PASSWORD: loupgarou
      POSTGRES_DB: loupgarou
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loupgarou"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 4000
      ADMIN_SECRET: ${ADMIN_SECRET:-change-me-to-a-long-random-string}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql://loupgarou:loupgarou@postgres:5432/loupgarou?schema=public
    ports:
      - "4000:4000"
    # `db push` keeps this MVP simple (no pre-generated migration files
    # required to boot). Once you've run `npm run prisma:migrate` locally
    # to create real migrations, switch this to `prisma migrate deploy`.
    command: sh -c "npx prisma db push --skip-generate && npx tsx src/index.ts"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:3000"

volumes:
  postgres_data:
