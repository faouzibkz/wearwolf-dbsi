services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: loupgarou
      POSTGRES_PASSWORD: loupgarou
      POSTGRES_DB: loupgarou
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loupgarou"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql://loupgarou:loupgarou@postgres:5432/loupgarou?schema=public
    ports:
      # Not the public port anymore (see `proxy` below) — kept mapped to a
      # different host port purely so you can `curl localhost:4001/health`
      # directly for debugging without going through the proxy.
      - "4001:4000"
    # `db push` keeps this MVP simple (no pre-generated migration files
    # required to boot). Once you've run `npm run prisma:migrate` locally
    # to create real migrations, switch this to `prisma migrate deploy`.
    # --accept-data-loss: this is a local dev database with no real player
    # data to protect, so schema changes (e.g. adding a new unique
    # constraint) should just apply instead of blocking startup waiting for
    # a confirmation nobody can give inside a container.
    command: sh -c "npx prisma db push --skip-generate --accept-data-loss && npx tsx src/index.ts"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Same-origin as the page itself once the proxy is in front of
        # everything — see proxy/nginx.conf and TAILSCALE_SETUP.md. Only
        # override this in .env if you're doing something unusual.
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      # Not the public port anymore (see `proxy` below) — kept mapped to a
      # different host port purely for direct debugging without the proxy.
      - "3001:3000"

  # Single public entry point — fronts both `web` and `server` on one port
  # so a Tailscale Funnel (or any tunnel) only ever needs to expose this
  # one. See proxy/nginx.conf for the routing and why this replaced the old
  # two-port (3000 + 8443) setup.
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
      - server
    ports:
      - "3000:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
