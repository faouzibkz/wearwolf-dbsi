# Single public entry point in front of both the Next.js web app and the
# game server (REST + Socket.IO), so a Tailscale Funnel (or any other
# tunnel) only ever needs to expose ONE port.
#
# Before this, the server was funneled on its own separate port (8443,
# since Tailscale Funnel only allows 443/8443/10000 and 443 was already
# taken by the web app). Plenty of wifi networks — guest networks, hotel/
# cafe wifi, some home routers, some school/office networks — block
# outbound traffic on non-standard ports like 8443 while leaving 443 (and
# cellular data, which essentially never blocks anything) untouched. That's
# the leading explanation for "the page loads but the game connection never
# comes up on wifi, works fine on mobile data" reports: the browser could
# always reach the web app on 443, but the separate socket connection on
# 8443 was quietly being blocked by that particular network.
#
# Routing both through this one proxy on a single port removes the second
# port entirely — everything looks like ordinary HTTPS on one port to any
# network, wifi included. See TAILSCALE_SETUP.md for the funnel command.
server {
    listen 80;

    # Socket.IO — every night action, vote, and live game-state push rides
    # this connection. Needs the Upgrade/Connection headers for the
    # WebSocket handshake, buffering off (long-polling fallback shouldn't be
    # held back waiting for a buffer to fill), and a long read/send timeout
    # since a real game leaves this connection open and mostly idle for
    # minutes at a time between actions — nginx's 60s default would silently
    # drop it mid-game.
    location /socket.io/ {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # REST API — auth, account/profile, history, badges, leaderboard.
    location /api/ {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Plain health check, same server.
    location = /health {
        proxy_pass http://server:4000;
        proxy_set_header Host $host;
    }

    # Everything else — the Next.js web app itself.
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
